[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saocpm-eval"
version = "0.1.0"
description = "Reproducible evaluation harness for FLOWVAULT state-aware object-centric process mining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "numpy>=2.1",
  "pandas>=2.2",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.7",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]

[project.scripts]
saocpm-eval = "saocpm_eval.cli:main"

[tool.setuptools.packages.find]
include = ["saocpm_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["saocpm_eval"]

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
